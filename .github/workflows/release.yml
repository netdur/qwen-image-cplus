name: Release prebuilt binaries

on:
  push:
    tags:
      - "v*"
  # A manual run builds and checks the macOS, Linux and Windows distributions
  # and the snap, keeps the Linux and Windows packages as workflow artifacts,
  # and publishes nothing.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos-arm64:
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      RELEASE: ${{ github.event_name == 'push' }}
    outputs:
      version: ${{ steps.meta.outputs.version }}
      sha: ${{ steps.publish.outputs.sha }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Resolve and validate version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RELEASE" = true ]; then
            tag="${{ github.ref_name }}"
            version="${tag#v}"
          else
            # A manual run has no tag; the packages name the version.
            version=$(sed -n 's/^version *= *"\([^"]*\)"$/\1/p' gui/Cplus.toml)
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Require Apple Silicon and matching package versions
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          version="${{ steps.meta.outputs.version }}"
          for manifest in qwen_image/Cplus.toml qwen_image_metal/Cplus.toml qwen_image_runtime/Cplus.toml cli/Cplus.toml ffi/Cplus.toml gui/Cplus.toml; do
            grep -Eq "^version *= *\"${version}\"$" "$manifest"
          done

      - uses: dtolnay/rust-toolchain@stable

      - name: Build the pinned C+ compiler
        run: |
          # The same pinned commit as Linux and Windows, with its vendor/ as the
          # package set. The released 0.0.29 toolchain cannot build this source:
          # its package manager fetches the sibling qwen_image package from the
          # cplus release, and its facet predates button(symbol:).
          scripts/install-cpc-source.sh "$RUNNER_TEMP/cplus"
          echo "$RUNNER_TEMP/cplus/target/release" >> "$GITHUB_PATH"
          CPLUS_VENDOR="$RUNNER_TEMP/cplus/vendor" scripts/link_vendor.sh

      - name: Build and verify distribution
        run: |
          cpc fmt --check qwen_image/src/api.cplus qwen_image/src/engine.cplus qwen_image/src/qwen_image.cplus
          cpc fmt --check cli/src/main.cplus
          cpc fmt --check ffi/src/ffi.cplus
          ./build.sh
          scripts/verify-dist.sh

      - name: Run project tests
        run: |
          (cd qwen_image && cpc test --release --json --filter qwen_image::src) \
            | tee "$RUNNER_TEMP/qwen-image-tests.jsonl"
          tail -n 1 "$RUNNER_TEMP/qwen-image-tests.jsonl" | jq -e '.failed == 0'

          (cd qwen_image_metal && cpc test --release --json --filter qwen_image_metal::src) \
            | tee "$RUNNER_TEMP/qwen-image-metal-tests.jsonl"
          tail -n 1 "$RUNNER_TEMP/qwen-image-metal-tests.jsonl" | jq -e '.failed == 0'

          (cd ffi && cpc test --release --json --filter ffi_version) \
            | tee "$RUNNER_TEMP/qwen-image-ffi-tests.jsonl"
          tail -n 1 "$RUNNER_TEMP/qwen-image-ffi-tests.jsonl" | jq -e '.failed == 0'

      - name: Package distribution
        id: package
        shell: bash
        run: |
          set -euo pipefail
          asset=qwen-image-cplus-aarch64-apple-darwin.tar.gz
          tar -czf "$asset" -C dist bin include lib "Qwen Image.app"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"

      - name: Publish immutable release asset
        id: publish
        if: env.RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          asset="${{ steps.package.outputs.asset }}"

          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --title "$tag" --generate-notes
          fi

          if gh release view "$tag" --json assets \
              --jq '.assets[].name' | grep -Fxq "$asset"; then
            mkdir existing-release
            gh release download "$tag" --pattern "$asset" --dir existing-release
            published_asset="existing-release/$asset"
          else
            gh release upload "$tag" "$asset"
            published_asset="$asset"
          fi

          sha=$(shasum -a 256 "$published_asset" | cut -d' ' -f1)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "published $asset ($sha)"

  build-linux-x86_64:
    runs-on: ubuntu-24.04
    env:
      CUDA_HOME: /usr/local/cuda-12.6
      # A tagged release uploads the snap to the Snap Store only when this
      # secret exists; it attaches the .snap to the GitHub release either way.
      SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
      RELEASE: ${{ github.event_name == 'push' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Resolve and validate version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RELEASE" = true ]; then
            tag="${{ github.ref_name }}"
            version="${tag#v}"
          else
            # A manual run has no tag; the packages name the version.
            version=$(sed -n 's/^version *= *"\([^"]*\)"$/\1/p' gui/Cplus.toml)
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Require matching package versions
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.meta.outputs.version }}"
          for manifest in qwen_image/Cplus.toml qwen_image_cuda/Cplus.toml qwen_image_runtime/Cplus.toml cli/Cplus.toml ffi/Cplus.toml gui/Cplus.toml; do
            grep -Eq "^version *= *\"${version}\"$" "$manifest"
          done

      - name: Free disk space
        run: |
          # CUDA, cuDNN, the 1.3 GB distribution and the snap do not fit
          # beside the runner's preinstalled SDKs.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install build dependencies
        run: |
          set -euo pipefail
          # clang-19: cpc needs LLVM 19 or newer (24.04's bare clang is 18).
          curl -fsSLO https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang-19 libgtk-4-dev libjpeg-turbo8-dev patchelf \
            cuda-nvcc-12-6 cuda-cudart-dev-12-6 libcublas-dev-12-6

      - name: Install cuDNN 8.9.7
        shell: bash
        run: |
          set -euo pipefail
          # NVIDIA's 24.04 repository carries cuDNN 9 only; the engine links
          # cuDNN 8. Its PyPI wheel holds the same libraries and header.
          wheel=nvidia_cudnn_cu12-8.9.7.29-py3-none-manylinux1_x86_64.whl
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$wheel" \
            "https://files.pythonhosted.org/packages/py3/n/nvidia-cudnn-cu12/$wheel"
          echo "adf4f59ed7a1341103822ed8df6e144f4d47ea8b10d9bf0ea0047ba738fd7b02  $RUNNER_TEMP/$wheel" | sha256sum -c -
          mkdir "$RUNNER_TEMP/cudnn"
          python3 -m zipfile -e "$RUNNER_TEMP/$wheel" "$RUNNER_TEMP/cudnn"
          rm "$RUNNER_TEMP/$wheel"
          sudo cp "$RUNNER_TEMP"/cudnn/nvidia/cudnn/lib/libcudnn.so.8 \
                  "$RUNNER_TEMP"/cudnn/nvidia/cudnn/lib/libcudnn_ops_infer.so.8 \
                  "$RUNNER_TEMP"/cudnn/nvidia/cudnn/lib/libcudnn_cnn_infer.so.8 \
                  "$CUDA_HOME/lib64/"
          sudo cp "$RUNNER_TEMP"/cudnn/nvidia/cudnn/include/*.h "$CUDA_HOME/include/"
          rm -rf "$RUNNER_TEMP/cudnn"

      - uses: dtolnay/rust-toolchain@stable

      - name: Build the pinned C+ compiler
        run: |
          scripts/install-cpc-source.sh "$RUNNER_TEMP/cplus"
          echo "CPC=$RUNNER_TEMP/cplus/target/release/cpc" >> "$GITHUB_ENV"
          CPLUS_VENDOR="$RUNNER_TEMP/cplus/vendor" scripts/link_vendor.sh

      - name: Build and verify distribution
        run: ./build.sh

      - name: Run project tests
        run: |
          (cd qwen_image && "$CPC" test --release --json --filter qwen_image::src) \
            | tee "$RUNNER_TEMP/qwen-image-tests.jsonl"
          tail -n 1 "$RUNNER_TEMP/qwen-image-tests.jsonl" | jq -e '.failed == 0'

          (cd ffi && "$CPC" test --release --json --filter ffi_version) \
            | tee "$RUNNER_TEMP/qwen-image-ffi-tests.jsonl"
          tail -n 1 "$RUNNER_TEMP/qwen-image-ffi-tests.jsonl" | jq -e '.failed == 0'

      - name: Build snap
        id: snap
        shell: bash
        run: |
          set -euo pipefail
          sudo snap install snapcraft --classic
          # The runner is Ubuntu 24.04, the snap's base, so snapcraft packs
          # the already-verified dist/ on the host instead of in a container.
          sudo snapcraft pack --destructive-mode
          snap_file=$(ls qwen-image-cplus_*_amd64.snap)
          echo "file=$snap_file" >> "$GITHUB_OUTPUT"

      - name: Keep the snap as a workflow artifact
        if: env.RELEASE != 'true'
        uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.snap.outputs.file }}
          path: ${{ steps.snap.outputs.file }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Attach snap to the release
        if: env.RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          snap_file="${{ steps.snap.outputs.file }}"
          # The macOS job may be creating the release at the same moment.
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" --title "$tag" --generate-notes || \
            gh release view "$tag" >/dev/null
          if ! gh release view "$tag" --json assets \
              --jq '.assets[].name' | grep -Fxq "$snap_file"; then
            gh release upload "$tag" "$snap_file"
          fi

      - name: Publish snap to the Snap Store
        if: env.RELEASE == 'true' && env.SNAPCRAFT_STORE_CREDENTIALS != ''
        run: snapcraft upload --release=stable "${{ steps.snap.outputs.file }}"

  build-windows-x86_64:
    uses: ./.github/workflows/windows.yml
    with:
      release: ${{ github.event_name == 'push' }}

  update-formula:
    if: github.event_name == 'push'
    needs: build-macos-arm64
    runs-on: ubuntu-latest
    steps:
      - name: Check out current main branch
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Render formula
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Formula
          sed \
            -e "s/@VERSION@/${{ needs.build-macos-arm64.outputs.version }}/g" \
            -e "s/@SHA@/${{ needs.build-macos-arm64.outputs.sha }}/g" \
            .github/homebrew/qwen-image-cplus.rb.in \
            > Formula/qwen-image-cplus.rb
          cat Formula/qwen-image-cplus.rb

      - name: Commit formula update
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- Formula/qwen-image-cplus.rb)" ]; then
            echo "formula is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/qwen-image-cplus.rb
          git commit -m "Update Homebrew formula for v${{ needs.build-macos-arm64.outputs.version }}"
          git push origin HEAD:main
