name: Windows

# The Windows build, on its own so it can run on every push to the branch that
# carries the port, and called by the release workflow for tags and manual
# runs. Only the release workflow's tag push makes it publish.
on:
  push:
    branches:
      - windows-port
  workflow_call:
    inputs:
      release:
        description: Attach the package to the release named by the tag.
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-windows-x86_64:
    # windows-2022 for Visual Studio 2022: CUDA 12.6's nvcc accepts MSVC up to
    # 14.4x and refuses a newer toolset.
    runs-on: windows-2022
    env:
      RELEASE: ${{ inputs.release == true }}
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Resolve and validate version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          if [ "$RELEASE" = true ]; then
            tag="${{ github.ref_name }}"
            version="${tag#v}"
          else
            # A manual run has no tag; the packages name the version.
            version=$(sed -n 's/^version *= *"\([^"]*\)"$/\1/p' gui/Cplus.toml)
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Require matching package versions
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.meta.outputs.version }}"
          for manifest in qwen_image/Cplus.toml qwen_image_cuda/Cplus.toml qwen_image_runtime/Cplus.toml cli/Cplus.toml ffi/Cplus.toml gui/Cplus.toml; do
            grep -Eq "^version *= *\"${version}\"$" "$manifest"
          done

      - name: Install LLVM 19 and NASM
        shell: pwsh
        run: |
          # cpc needs LLVM 19 or newer (clang, lld-link, llvm-ar, llvm-rc). The
          # image's own LLVM is used when it is new enough. NASM gives
          # libjpeg-turbo its SIMD path.
          $clang = "C:\Program Files\LLVM\bin\clang.exe"
          $major = 0
          if (Test-Path $clang) {
            if ((& $clang --version | Select-Object -First 1) -match "version (\d+)\.") { $major = [int]$Matches[1] }
          }
          if ($major -lt 19) { choco install llvm --version=19.1.7 --allow-downgrade -y --no-progress }
          & $clang --version | Select-Object -First 1
          choco install nasm -y --no-progress
          "C:\Program Files\LLVM\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
          "C:\Program Files\NASM" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Install CUDA 12.6, cuDNN 8.9.7 and libjpeg-turbo
        shell: pwsh
        run: |
          $env:PATH = "C:\Program Files\NASM;$env:PATH"
          & scripts\install-windows-deps.ps1 "$env:RUNNER_TEMP\deps" |
            Tee-Object -Variable lines
          $lines | Where-Object { $_ -match "^(CUDA_HOME|CUDNN_HOME|JPEG_HOME)=" } |
            Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - uses: dtolnay/rust-toolchain@stable

      - name: Build the pinned C+ compiler
        shell: bash
        run: |
          set -euo pipefail
          clang --version | head -1
          scripts/install-cpc-source.sh "$RUNNER_TEMP/cplus"
          echo "CPC=$(cygpath -w "$RUNNER_TEMP/cplus/target/release/cpc.exe")" >> "$GITHUB_ENV"
          CPLUS_VENDOR="$RUNNER_TEMP/cplus/vendor" scripts/link_vendor.sh

      - name: Build and verify distribution
        shell: pwsh
        run: scripts\build-windows.ps1

      - name: Run project tests
        shell: bash
        run: |
          set -euo pipefail
          # The ffi test binary links the CUDA backend. Linux finds its
          # libraries through the RUNPATH the build bakes in; Windows has none,
          # so the bundled DLLs in dist\bin go on PATH, or the binary cannot
          # start (and cpc test exits 1 without a word).
          export PATH="$PWD/dist/bin:$PATH"
          (cd qwen_image && "$CPC" test --release --json --filter qwen_image::src) \
            | tee "$RUNNER_TEMP/qwen-image-tests.jsonl"
          tail -n 1 "$RUNNER_TEMP/qwen-image-tests.jsonl" | jq -e '.failed == 0'

          (cd ffi && "$CPC" test --release --json --filter ffi_version) \
            | tee "$RUNNER_TEMP/qwen-image-ffi-tests.jsonl"
          tail -n 1 "$RUNNER_TEMP/qwen-image-ffi-tests.jsonl" | jq -e '.failed == 0'

      - name: Install Inno Setup 6.7.3
        shell: pwsh
        run: |
          # Pinned by hash rather than taken from the image or Chocolatey, so a
          # new major version cannot change the installer under the script.
          $installer = "$env:RUNNER_TEMP\innosetup-6.7.3.exe"
          Invoke-WebRequest -UseBasicParsing -OutFile $installer `
            https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe
          $hash = (Get-FileHash -Algorithm SHA256 $installer).Hash
          if ($hash -ne "9C73C3BAE7ED48D44112A0F48E66742C00090BDB5BEF71D9D3C056C66E97B732") { throw "innosetup-6.7.3.exe: unexpected SHA256 $hash" }
          $dir = "$env:RUNNER_TEMP\innosetup"
          Start-Process -Wait -FilePath $installer -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER", "/DIR=`"$dir`""
          if (-not (Test-Path "$dir\ISCC.exe")) { throw "Inno Setup did not install" }
          "ISCC=$dir\ISCC.exe" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Build the installer
        id: package
        shell: pwsh
        run: |
          & $env:ISCC /Q "/DAppVersion=${{ steps.meta.outputs.version }}" windows\qwen-image-cplus.iss
          if ($LASTEXITCODE -ne 0) { throw "iscc failed" }
          $asset = "qwen-image-cplus-x86_64-pc-windows-msvc-setup.exe"
          if (-not (Test-Path $asset)) { throw "iscc did not write $asset" }
          "asset=$asset" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT

      - name: Check the installer installs and uninstalls
        shell: pwsh
        run: |
          # A per-user install into a scratch folder, the CLI started from it
          # with nothing on PATH but the system, and the uninstaller run.
          # The runner has no NVIDIA driver; /SUPPRESSMSGBOXES answers the
          # warning with its default, Yes.
          $dir = "$env:RUNNER_TEMP\qwen-image-install"
          Start-Process -Wait -FilePath .\${{ steps.package.outputs.asset }} -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/CURRENTUSER", "/DIR=`"$dir`"", "/TASKS=addtopath"
          foreach ($file in "bin\qwen-image-cplus.exe", "bin\qwen-image-gui.exe", "bin\qwen_image.dll", "bin\cudnn64_8.dll", "include\qwen_image.h", "lib\qwen_image.lib", "lib\qwen_image_static.lib", "unins000.exe") {
            if (-not (Test-Path (Join-Path $dir $file))) { throw "the installer did not install $file" }
          }
          if ((Get-ItemProperty HKCU:\Environment).Path -notlike "*$dir\bin*") { throw "the installer did not put bin on PATH" }
          $savedPath = $env:PATH
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          try {
            $usage = & "$dir\bin\qwen-image-cplus.exe" 2>&1 | Out-String
            if ($usage -notmatch "usage: qwen-image-cplus") { throw "the installed CLI does not start" }
          } finally {
            $env:PATH = $savedPath
          }
          Start-Process -Wait -FilePath "$dir\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART"
          # The uninstaller copies itself to %TEMP% and finishes from there.
          for ($i = 0; $i -lt 30 -and (Test-Path "$dir\bin"); $i++) { Start-Sleep 1 }
          if (Test-Path "$dir\bin") { throw "the uninstaller left $dir\bin" }
          if ((Get-ItemProperty HKCU:\Environment).Path -like "*$dir\bin*") { throw "the uninstaller left bin on PATH" }

      - name: Keep the package as a workflow artifact
        if: env.RELEASE != 'true'
        uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.package.outputs.asset }}
          path: ${{ steps.package.outputs.asset }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Attach package to the release
        if: env.RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ github.ref_name }}"
          asset="${{ steps.package.outputs.asset }}"
          # The macOS and Linux jobs may be creating the release at the same
          # moment.
          gh release view "$tag" >/dev/null 2>&1 || \
            gh release create "$tag" --title "$tag" --generate-notes || \
            gh release view "$tag" >/dev/null
          if ! gh release view "$tag" --json assets \
              --jq '.assets[].name' | grep -Fxq "$asset"; then
            gh release upload "$tag" "$asset"
          fi
