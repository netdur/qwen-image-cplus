name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos-arm64:
    runs-on: macos-15
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Require Apple Silicon
        run: test "$(uname -m)" = arm64

      - name: Install pinned C+ compiler
        run: |
          scripts/install-cpc.sh "$RUNNER_TEMP/cplus"
          echo "$RUNNER_TEMP/cplus" >> "$GITHUB_PATH"

      - name: Install released C+ packages
        run: cpc pm install qwen_image

      - name: Check formatting
        run: |
          cpc fmt --check qwen_image/src/api.cplus qwen_image/src/qwen_image.cplus
          cpc fmt --check cli/src/main.cplus
          cpc fmt --check ffi/src/ffi.cplus

      - name: Build distribution
        run: ./build.sh

      - name: Run project tests
        run: |
          (cd qwen_image && cpc test --release --json --filter qwen_image::src) \
            | tee "$RUNNER_TEMP/qwen-image-tests.jsonl"
          tail -n 1 "$RUNNER_TEMP/qwen-image-tests.jsonl" | jq -e '.failed == 0'

          (cd ffi && cpc test --release --json --filter ffi_version) \
            | tee "$RUNNER_TEMP/qwen-image-ffi-tests.jsonl"
          tail -n 1 "$RUNNER_TEMP/qwen-image-ffi-tests.jsonl" | jq -e '.failed == 0'

      - name: Verify installable artifacts
        run: scripts/verify-dist.sh
