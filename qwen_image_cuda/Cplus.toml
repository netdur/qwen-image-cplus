[package]
name    = "qwen_image_cuda"
version = "0.2.2"
edition = "2026"

[dependencies]
qwen_image = "*"
stdlib     = "*"
json       = "*"

# Consumers compile this package into their program object instead of linking
# a prebuilt slice. cpc places a dependency's [link] inputs before its prebuilt
# archive, so with a slice GNU ld would reach libqwen_image_cuda.a before the
# code that calls into it and drop it.
[build]
prebuild = false

# CUDA kernels and native/*.c helpers built by build_cuda.sh; libjpeg
# (libjpeg-turbo) decodes condition JPEGs. Linux today; a Windows port adds a
# [windows.link] beside this one (the backend is CUDA, not Linux).
[linux.link]
libs          = ["cudart", "cublas", ":libcudnn.so.8", "jpeg", "stdc++"]
search-paths  = ["${CUDA_HOME:-/usr/local/cuda}/lib64"]
extra-objects = ["cuda/target/libqwen_image_cuda.a"]
