[package]
name    = "qwen_image_cuda"
version = "0.2.5"
edition = "2026"

[dependencies]
qwen_image = "*"
stdlib     = "*"
json       = "*"

# Consumers compile this package into their program object instead of linking
# a prebuilt slice. cpc places a dependency's [link] inputs before its prebuilt
# archive, so with a slice GNU ld would reach libqwen_image_cuda.a before the
# code that calls into it and drop it.
[build]
prebuild = false

# CUDA kernels and native/*.c helpers built by build_cuda.sh (build_cuda.ps1
# on Windows); libjpeg (libjpeg-turbo) decodes condition JPEGs. The backend is
# CUDA, not Linux, so the two tables differ only in how libraries are found.
[linux.link]
libs          = ["cudart", "cublas", ":libcudnn.so.8", "jpeg", "stdc++"]
search-paths  = ["${CUDA_HOME:-/usr/local/cuda}/lib64"]
extra-objects = ["cuda/target/libqwen_image_cuda.a"]

# Import libraries by full path: `search-paths` also emits an ELF `-rpath`,
# which lld-link does not take. The DLLs they import must sit beside the
# executable or on PATH at run time. libjpeg-turbo is linked statically; the
# C++ runtime comes in through the kernel objects' own /MT directives.
[windows.link]
extra-objects = [
    "cuda/target/qwen_image_cuda.lib",
    "${CUDA_HOME}/lib/x64/cudart.lib",
    "${CUDA_HOME}/lib/x64/cublas.lib",
    "${CUDNN_HOME}/lib/x64/cudnn.lib",
    "${JPEG_HOME}/lib/jpeg-static.lib",
]
