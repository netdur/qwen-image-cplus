[package]
name    = "gui"
version = "0.2.5"
edition = "2026"

# The Qwen Image desktop app: facet UI over qwen_image/api. The same source on
# macOS (AppKit through facet_appkit, Metal backend), Linux (GTK 4 through
# facet_gtk, CUDA backend) and Windows (Win32 through facet_win32, CUDA
# backend); the native pieces left (preferences storage, reference-image size,
# system paths) are `_macos` / `_linux` / `_windows` files beside a neutral base.

[dependencies]
stdlib             = "*"
facet              = "*"
facet_runtime      = "*"
flex_layout        = "*"
events             = "*"
qwen_image         = "*"
qwen_image_runtime = "*"
inspector          = "*"
facet_agent        = "*"
agent_core         = "*"
agent_inapp        = "*"
agent_mcp          = "*"
json               = "*"

[macos.dependencies]
qwen_image_metal = "*"
facet_appkit     = "*"
appkit           = "*"
foundation       = "*"
metal            = "*"
objc             = "*"
quartzcore       = "*"
webkit           = "*"
agent_appkit     = "*"

# The CUDA backend, facet's GTK 4 backend, and the GTK stack they walk (the
# resolver validates imports against this one flat set).
[linux.dependencies]
qwen_image_cuda = "*"
facet_gtk       = "*"
agent_gtk       = "*"
gtk4            = "*"
gobject         = "*"
gobject_gir     = "*"
gio             = "*"
glib            = "*"
cairo           = "*"
gdk             = "*"
gdkpixbuf       = "*"
graphene        = "*"
gsk             = "*"
harfbuzz        = "*"
pango           = "*"
pangocairo      = "*"
gmodule         = "*"

# The CUDA backend and facet's Win32 backend, which needs nothing installed:
# user32 and gdi32 ship with Windows.
[windows.dependencies]
qwen_image_cuda = "*"
facet_win32     = "*"
agent_win32     = "*"
win32           = "*"
