[package]
name    = "qwen_image_ffi"
version = "0.2.4"
edition = "2026"

[library]
name  = "qwen_image"
entry = "src/ffi.cplus"
kind  = "both"

# The C library over the public API; the platform's backend comes through
# qwen_image_runtime. Backends are named per platform because the resolver
# validates imports against this manifest's flat dependency set.
[dependencies]
qwen_image         = "*"
qwen_image_runtime = "*"
json               = "*"
stdlib             = "*"

[macos.dependencies]
qwen_image_metal = "*"
objc             = "*"
metal            = "*"
foundation       = "*"

[linux.dependencies]
qwen_image_cuda = "*"

[windows.dependencies]
qwen_image_cuda = "*"
